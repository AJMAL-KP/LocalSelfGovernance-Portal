{% extends 'lsg/base.html' %}

{% block title %}Access Denied - LSG Portal{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="custom-card my-5 text-center">
            <h3 class="fw-bold text-danger mb-3">
                <i class="bi bi-shield-slash me-2"></i>Access Denied
            </h3>
            <p class="text-secondary">
                You do not have permission to access the requested resource. If you believe this is an error, please contact the administrator.
            </p>
            <a href="{% url 'posts' %}" class="lsg-btn-primary mt-3">
                <i class="bi bi-arrow-left me-1"></i>Back to Home
            </a>
        </div>
    </div>
</div>
{% endblock %}
